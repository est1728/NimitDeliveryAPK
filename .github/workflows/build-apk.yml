name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle assembleCustomerDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NimitDelivery-apk
          path: app/build/outputs/apk/customer/debug/*.apk
      - run: gradle assembleCustomerRelease --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/build/outputs/apk/customer/release/*.apk') != ''
        with:
          name: NimitDelivery-release-apk
          path: app/build/outputs/apk/customer/release/*.apk
      - name: Publish release
        if: hashFiles('app/build/outputs/apk/customer/release/*.apk') != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cp app/build/outputs/apk/customer/release/*.apk NimitDelivery-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" NimitDelivery-build-${{ github.run_number }}.apk --repo est1728/NimitDelivery-releases --title "Build ${{ github.run_number }}" --notes "auto build" --latest

      - run: gradle assembleRiderRelease --no-daemon
      - name: Publish rider
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cp app/build/outputs/apk/rider/release/*.apk NimitRider-build-${{ github.run_number }}.apk
          gh release create "rider-build-${{ github.run_number }}" NimitRider-build-${{ github.run_number }}.apk --repo est1728/NimitDelivery-releases --title "Rider ${{ github.run_number }}" --notes "rider test" --prerelease

      - run: gradle assembleShopRelease --no-daemon
      - name: Publish shop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cp app/build/outputs/apk/shop/release/*.apk NimitShop-build-${{ github.run_number }}.apk
          gh release create "shop-build-${{ github.run_number }}" NimitShop-build-${{ github.run_number }}.apk --repo est1728/NimitDelivery-releases --title "Shop ${{ github.run_number }}" --notes "shop test" --prerelease
      - run: gradle assembleDevRelease --no-daemon
      - name: Publish dev
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cp app/build/outputs/apk/dev/release/*.apk NimitDev-build-${{ github.run_number }}.apk
          gh release create "dev-build-${{ github.run_number }}" NimitDev-build-${{ github.run_number }}.apk --repo est1728/NimitDelivery-releases --title "Dev ${{ github.run_number }}" --notes "dev test" --prerelease

      - run: gradle assembleAdminRelease --no-daemon
      - name: Publish admin
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cp app/build/outputs/apk/admin/release/*.apk NimitAdmin-build-${{ github.run_number }}.apk
          gh release create "admin-build-${{ github.run_number }}" NimitAdmin-build-${{ github.run_number }}.apk --repo est1728/NimitDelivery-releases --title "Admin ${{ github.run_number }}" --notes "admin test" --prerelease

      # ไฟล์ AAB สำหรับอัปโหลด Play Store (ทำเมื่อมี secret คีย์อัปโหลดครบ ถ้าไม่มีจะข้ามไปเฉยๆ)
      - name: Build shop AAB (Play Store)
        continue-on-error: true
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then echo "ไม่มี secret คีย์อัปโหลด ข้ามการสร้าง AAB"; exit 0; fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" gradle bundleShopRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/build/outputs/bundle/shopRelease/*.aab') != ''
        with:
          name: NimitShop-aab
          path: app/build/outputs/bundle/shopRelease/*.aab
